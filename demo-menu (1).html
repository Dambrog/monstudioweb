<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taki Délices - Menu et commande WhatsApp</title>
<meta name="description" content="Taki Délices : apéritifs, minis, crêpes et pâtisseries. Commandez directement sur WhatsApp.">
<style>
:root{--rouge:#b3361b;--creme:#fff8ec;--encre:#2a1d16;--gris:#6e5e54;--ligne:#ecdcc4;--vert:#1fa855}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;background:var(--creme);color:var(--encre);padding-bottom:90px;line-height:1.5}
header{background:var(--rouge);color:#fff;text-align:center;padding:26px 16px}
header h1{font-family:Georgia,serif;font-size:1.8rem}
header p{opacity:.9;font-size:.95rem;margin-top:4px}
.cats{position:sticky;top:0;background:var(--creme);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--ligne);z-index:5}
.cats button{white-space:nowrap;border:2px solid var(--rouge);background:#fff;color:var(--rouge);padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--rouge);color:#fff}
main{max-width:640px;margin:0 auto;padding:14px}
.plat{display:flex;gap:12px;background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:12px;margin-bottom:12px;align-items:center}
.photo{width:84px;height:84px;border-radius:10px;background:linear-gradient(135deg,#e9a23b,#b3361b);flex:none;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.info{flex:1}
.info h3{font-size:1rem}
.info p{font-size:.82rem;color:var(--gris)}
.prix{font-weight:700;color:var(--rouge);margin-top:2px}
.qte{display:flex;align-items:center;gap:8px}
.qte button{width:34px;height:34px;border-radius:50%;border:0;background:var(--rouge);color:#fff;font-size:1.2rem;cursor:pointer}
.qte span{min-width:18px;text-align:center;font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e9a23b;outline-offset:2px}
.barre{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ligne);padding:12px 14px;display:flex;justify-content:center}
.barre button{width:100%;max-width:612px;background:var(--vert);color:#fff;border:0;border-radius:10px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer}
.barre button:disabled{background:#b9b2a8;cursor:not-allowed}
dialog{border:0;border-radius:14px;padding:20px;width:min(92vw,420px);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{font-family:Georgia,serif;margin-bottom:10px}
dialog input,dialog textarea{width:100%;padding:11px;border:1px solid var(--ligne);border-radius:8px;margin-bottom:10px;font-size:1rem;font-family:inherit}
.ligne{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;padding:3px 0}
.total{font-weight:700;border-top:1px solid var(--ligne);margin-top:6px;padding-top:8px}
.acts{display:flex;gap:8px;margin-top:8px}
.acts button{flex:1;padding:12px;border-radius:8px;border:0;font-weight:700;cursor:pointer;font-size:.95rem}
.ok{background:var(--vert);color:#fff}.non{background:#eee}
</style>
</head>
<body>
<header>
  <h1>Taki Délices</h1>
  <p>Traiteur · Apéritifs, minis, crêpes et pâtisseries</p>
  <p>WhatsApp : +229 01 67 18 83 29</p>
</header>
<div class="cats" id="cats" role="group" aria-label="Catégories"></div>
<main id="liste"></main>
<div class="barre"><button id="voir" disabled>Votre panier est vide</button></div>

<dialog id="dlg">
  <h2>Votre commande</h2>
  <div id="recap"></div>
  <input id="nom" placeholder="Votre nom" autocomplete="name">
  <input id="adresse" placeholder="Lieu et date de livraison" autocomplete="street-address">
  <textarea id="note" placeholder="Remarque (heure, allergies, personnalisation...)" rows="2"></textarea>
  <div class="acts"><button class="non" id="fermer">Retour</button><button class="ok" id="envoyer">Envoyer sur WhatsApp</button></div>
</dialog>

];

const panier = {};
let catActive = "Tous";
const fmt = n => n.toLocaleString("fr-FR").replace(/[\u202f\u00a0]/g," ") + " " + MONNAIE;
const echapper = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

const cats = ["Tous", ...new Set(PLATS.map(p => p.cat))];
const zoneCats = document.getElementById("cats");
cats.forEach(c => {
  const b = document.createElement("button");
  b.textContent = c; b.type = "button";
  b.onclick = () => { catActive = c; rendre(); window.scrollTo({top:0}); };
  zoneCats.appendChild(b);
});

function rendre(){
  zoneCats.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.textContent === catActive));
  const liste = document.getElementById("liste");
  liste.innerHTML = "";
  PLATS.filter(p => catActive === "Tous" || p.cat === catActive).forEach(p => {
    const q = panier[p.id] || 0;
    const d = document.createElement("div");
    d.className = "plat";
    d.innerHTML = "<div class='photo'><img src='" + p.img + "' alt='" + echapper(p.nom) + "' onerror=\"this.remove()\"></div>" +
      "<div class='info'><h3>" + echapper(p.nom) + "</h3><div class='prix'>" + fmt(p.prix) + "</div></div>" +
      "<div class='qte'><button type='button' aria-label='Retirer " + echapper(p.nom) + "'>−</button><span>" + q +
      "</span><button type='button' aria-label='Ajouter " + echapper(p.nom) + "'>+</button></div>";
    const [moins, plus] = d.querySelectorAll(".qte button");
    moins.onclick = () => changer(p.id, -1);
    plus.onclick = () => changer(p.id, 1);
    liste.appendChild(d);
  });
  const total = totalPanier(), n = Object.values(panier).reduce((a,b) => a+b, 0);
  const voir = document.getElementById("voir");
  voir.disabled = n === 0;
  voir.textContent = n === 0 ? "Votre panier est vide" : "Voir ma commande (" + n + ") · " + fmt(total);
}
function changer(id, delta){
  panier[id] = Math.max(0, (panier[id] || 0) + delta);
  if (!panier[id]) delete panier[id];
  rendre();
}
function totalPanier(){
  return PLATS.reduce((s,p) => s + (panier[p.id] || 0) * p.prix, 0);
}

const dlg = document.getElementById("dlg");
document.getElementById("voir").onclick = () => {
  document.getElementById("recap").innerHTML = PLATS.filter(p => panier[p.id]).map(p =>
    "<div class='ligne'><span>" + panier[p.id] + " × " + echapper(p.nom) + "</span><span>" + fmt(panier[p.id]*p.prix) + "</span></div>").join("") +
    "<div class='ligne total'><span>Total</span><span>" + fmt(totalPanier()) + "</span></div>";
  dlg.showModal();
};
document.getElementById("fermer").onclick = () => dlg.close();
document.getElementById("envoyer").onclick = () => {
  const nom = document.getElementById("nom").value.trim();
  const adr = document.getElementById("adresse").value.trim();
  const note = document.getElementById("note").value.trim();
  let t = "Bonjour, je souhaite commander :\n";
  PLATS.filter(p => panier[p.id]).forEach(p => { t += "- " + panier[p.id] + " x " + p.nom + " (" + fmt(panier[p.id]*p.prix) + ")\n"; });
  t += "\nTotal : " + fmt(totalPanier());
  if (nom) t += "\nNom : " + nom;
  if (adr) t += "\nLivraison : " + adr;
  if (note) t += "\nRemarque : " + note;
  window.open("https://wa.me/" + NUMERO + "?text=" + encodeURIComponent(t), "_blank");
};
rendre();
</script>
